[project]
name = "idd-figures"
version = "0.1.0"
description = "Publication-quality figure templates and shared plotting functions for IDD work"
authors = [{ name = "Bobby Reiner" }]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    # Floors = verified-needed; no speculative upper caps — cap only at a
    # version that is tested and actually breaks, at that known number.
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=25.0.1",
]
# jobmon_installer_ihme is intentionally omitted (figures library, never runs
# Slurm; internal-only dep would break public CI). See .claude/DECISIONS.md.

[project.optional-dependencies]
# Heavy deps are confined to specific submodules (painters/maps, layouts/maps,
# composition, io, paths) — consumers opt in to what they use.
maps = [
    "cartopy>=0.25",
    "geopandas>=1.1",
    "shapely>=2.1",
]
ternary = ["mpltern>=1.0"]
thumbnails = ["pillow>=11"]
config = ["pyyaml>=6"]
all = ["idd-figures[maps,ternary,thumbnails,config]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "ipykernel>=7",  # >=7 so the conda env is selectable as a Jupyter kernel
    "nbclient>=0.11.0",
]

[build-system]
# uv_build is 0.x; upstream promises compatibility only within a minor, so this
# bracket reflects a known constraint, not a speculative cap. Build-time only.
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"
# Quarantine: attic/ is explicitly dead code kept for reference; the beeswarm
# solver + its notebooks and the template scripts predate the library and are
# lint-exempt until absorbed or retired (candidates for attic/).
extend-exclude = [
    "attic",
    "notebooks/transformations.ipynb",
    "notebooks/idd_beeswarm",
    "notebooks/template_scripts",
    "src/idd_figures/idd_beeswarm.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma — formatter handles
    "ISC001",   # implicit string concat — formatter handles
    "ANN",      # type hints — mypy handles
    "D",        # docstrings — too strict for research code
    "E501",     # line length — formatter handles
    "RET505",   # else after return — sometimes clearer
    "T201",     # print() — beeswarm solver uses intentional verbose logging
    "FBT002",   # boolean positional defaults — pervasive in plotting APIs
    "RUF001",   # ambiguous unicode (en-dash in bin labels) — intentional
    "N803",     # arg names like N_seq — domain naming
    "TRY003",   # long messages in raise — fine for research code
    "PLC0415",  # lazy imports ARE the architecture: geo stack / optional deps load on use
    "PLR0913",  # painter/layout knobs ARE the API; bundling them adds ceremony (2026-08-02)
    "PLR2004",  # tier boundaries + demo geometry read clearer inline than as constants
    "TC003",    # no typing-block ceremony — ANN is off, annotations are documentation here
]

[tool.ruff.lint.mccabe]
max-complexity = 15  # explicit tier ladders / realisers sit at 13; flag only real sprawl

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001", "T201"]
"tests/**" = ["S101", "ARG", "S105", "INP001", "PLR2004", "PT018", "SLF001"]
"**/__init__.py" = ["ERA001"]  # empty __init__s document the import convention in comments

[tool.mypy]
# Non-strict on purpose: the library is untyped-by-convention (house style);
# strict=true was aspirational and had never actually run in this clone
# (surfaced 2026-08-02 when pre-commit was first installed — 114 errors on the
# first 6 staged files). check_untyped_defs still type-checks function BODIES,
# so real bugs surface without demanding annotations. Revisit if a typing pass
# is ever scheduled (.claude/DECISIONS.md 2026-08-02).
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^attic/", "^src/idd_figures/idd_beeswarm\\.py$"]  # same quarantine as ruff

# The beeswarm solver is imported elsewhere, so mypy follows it past the file
# exclude — silence it at the module level until it is absorbed or retired.
[[tool.mypy.overrides]]
module = "idd_figures.idd_beeswarm"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
