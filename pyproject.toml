[project]
name = "idd-figures"
version = "0.1.0"
description = "Publication-quality figure templates and shared plotting functions for IDD work"
authors = [{ name = "Bobby Reiner" }]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    # Floors = verified-needed; no speculative upper caps — cap only at a
    # version that is tested and actually breaks, at that known number.
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]
# jobmon_installer_ihme is intentionally omitted (figures library, never runs
# Slurm; internal-only dep would break public CI). See .claude/DECISIONS.md.

[project.optional-dependencies]
# Heavy deps are confined to specific submodules (painters/maps, layouts/maps,
# composition, io, paths) — consumers opt in to what they use.
maps = [
    "cartopy>=0.25",
    "geopandas>=1.1",
    "shapely>=2.1",
]
ternary = ["mpltern>=1.0"]
thumbnails = ["pillow>=11"]
config = ["pyyaml>=6"]
all = ["idd-figures[maps,ternary,thumbnails,config]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "ipykernel>=7",  # >=7 so the conda env is selectable as a Jupyter kernel
]

[build-system]
# uv_build is 0.x; upstream promises compatibility only within a minor, so this
# bracket reflects a known constraint, not a speculative cap. Build-time only.
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma — formatter handles
    "ISC001",   # implicit string concat — formatter handles
    "ANN",      # type hints — mypy handles
    "D",        # docstrings — too strict for research code
    "E501",     # line length — formatter handles
    "RET505",   # else after return — sometimes clearer
    "T201",     # print() — beeswarm solver uses intentional verbose logging
    "FBT002",   # boolean positional defaults — pervasive in plotting APIs
    "RUF001",   # ambiguous unicode (en-dash in bin labels) — intentional
    "N803",     # arg names like N_seq — domain naming
    "TRY003",   # long messages in raise — fine for research code
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001", "T201"]
"tests/**" = ["S101", "ARG", "S105", "INP001", "PLR2004"]
"**/__init__.py" = ["ERA001"]  # empty __init__s document the import convention in comments

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
