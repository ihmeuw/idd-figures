repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: []

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-ast
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: no-absolute-paths
        name: block absolute filesystem paths
        # Public repo: ZERO absolute paths in any committed file (STANDARDS
        # §Path safety). .example files are safe by convention because they use
        # placeholder paths (/your/cluster/path/...) that don't match this regex.
        # This config excludes ITSELF (both here and in the entry's filter):
        # the entry line below contains the guard regex literally, so without
        # the exclusion the hook fails on its own config whenever it is staged.
        exclude: ^\.pre-commit-config\.yaml$
        entry: bash -c 'git diff --cached --name-only -z | grep -zv "^\.pre-commit-config\.yaml$" | xargs -0 grep -lE "(/ihme/|/snfs1/|/home/j/|/mnt/share/|^[A-Z]:\\\\)" 2>/dev/null | (! grep .)'
        language: system
        pass_filenames: false
